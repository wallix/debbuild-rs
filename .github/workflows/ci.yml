name: CI

# Pull requests and main: the quality checks, then the release build and its end-to-end
# gate, whose archives stay downloadable from the run. A push to `release` is gated by
# release.yml instead.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  build:
    needs: [quality]
    uses: ./.github/workflows/build.yml
    with:
      artifact-prefix: ci
